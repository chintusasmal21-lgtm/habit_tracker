<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    background: #eef3ff;
}

.card {
    border: none;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,.12);
}

textarea {
    resize: none;
}

</style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card">

                <div class="card-body p-4">

                    

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Your Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ request.user.username }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                value="{{ request.user.email }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Rate Your Experience
                            </label>

                            <select
                                name="rating"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Rating
                                </option>

                                <option value="5">
                                    ⭐⭐⭐⭐⭐ Excellent
                                </option>

                                <option value="4">
                                    ⭐⭐⭐⭐ Good
                                </option>

                                <option value="3">
                                    ⭐⭐⭐ Average
                                </option>

                                <option value="2">
                                    ⭐⭐ Poor
                                </option>

                                <option value="1">
                                    ⭐ Very Bad
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Your Feedback
                            </label>

                            <textarea
                                name="feedback"
                                rows="5"
                                class="form-control"
                                placeholder="Write your feedback..."
                                required></textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Submit Feedback

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a
                            href="{% url 'profile' %}"
                            class="btn btn-secondary">

                            ⬅ Back

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
